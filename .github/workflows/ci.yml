name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: 格式检查
        run: test -z "$(gofmt -l cmd internal)"
      - name: 静态检查
        run: go vet ./...
      - name: 单元测试
        run: go test ./...
      - name: Shell 语法
        run: |
          bash -n bootstrap.sh
          bash -n toolbox.sh
          bash toolbox.sh self-test
